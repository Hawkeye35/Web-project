<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Danish Windmill Museum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <header>
    <h1>Danish Windmill Museum</h1>

    <nav id="mainNav" style="display:none;">
    <ul>
        <li><a href="index.html">Data Entry</a></li>
        <li><a href="reports.html">Reports</a></li>
        <li><a href="summary.html">Summary</a></li>
        <li><a href="map.html">Map</a></li>
    </ul>
</nav>

    </header>

    <div class="container" id="loginSection">

    <h2>Login</h2>

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <button id="loginBtn">Login</button>

</div>

    <main id="mainContent" style="display:none;">
        <div class="container">
        <h2>Data Entry</h2>

    <form id="entryForm">

        <input name="firstName" placeholder="First Name" required>
        <input name="lastName" placeholder="Last Name" required>
        <input name="city" placeholder="City" required>
        <input name="state" placeholder="State" required>
        <input name="zip" placeholder="ZIP Code" type="text" required>

        <input name="numberOfPeople" placeholder="Number of People" type="number" min="1" required>

        <button type="submit">Submit</button>

    </form>

        <script src="submit.js"></script>

        </div>
    </main>

    <footer>
        <p>
            Danish Windmill Museum Web Project
        </p>
    </footer>

    <script>
document.addEventListener("DOMContentLoaded", function () {
    const loggedIn = localStorage.getItem("loggedIn");

    if (loggedIn === "true") {
        showWebsite();
    }

    document.getElementById("loginBtn").addEventListener("click", function () {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        if (username === "admin" && password === "windmill123") {
            localStorage.setItem("loggedIn", "true");
            showWebsite();
        } else {
            alert("Wrong username or password");
        }
    });

    function showWebsite() {
        document.getElementById("mainNav").style.display = "block";
        document.getElementById("mainContent").style.display = "block";
        document.getElementById("loginSection").style.display = "none";
    }
});
</script>
</body>
</html>
